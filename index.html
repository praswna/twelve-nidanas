# 연기의 나무 — 교리 점검

이 앱이 그리는 것 하나하나를 경전에 대어 본 기록. 그림의 뜻이 바뀔 때마다 이 문서를 같이 고친다.
검토 기준은 초기 경전(니까야)이며, 학파에 따라 갈리는 곳은 그렇다고 적었다.

## 이 앱이 그리는 것

| 마디 | 그림 |
|---|---|
| 식 ↔ 명색 | 서로 기대어 선 두 갈대. 접점에 불이 있다. |
| 촉 → 수 → 애 → 취 → 유 | 접점의 불에서 돋는 잔가지. 하나씩 켜지고, 다 타면 회색 흔적으로 가라앉는다. |
| 유 → 식의 증장 | 유가 들어올 때마다 불이 번쩍이고, 식·명색이 아래로 한 마디씩 뿌리내린다. |
| 생 | 옛 뿌리 더미에서 새 쌍이 각자 올라와 맞닿는 순간 접점과 불이 생긴다. |
| 노사 | 불의 밝기가 나이에 따라 흐려지고, 마지막에 꺼지며 접점이 사라지고 둘 다 회색으로 남는다. 마지막 유만 남았다가 새 쌍이 맞닿는 순간 꺼진다. |
| 이전 생들 | 화면 전체에 깔린 회색 뿌리. 시간이 갈수록 물러난다(0.1 → 첫 죽음 뒤 0.01). |

무명·행, 육입은 그리지 않는다. 무명은 화면 안의 사물이 아니라 **보는 방식**이다(아래 "한 줄기" 참고).

## 경전과 맞는 것

| 그림 | 근거 |
|---|---|
| 무명·행·육입 없이 식↔명색, 명색→촉 | DN 15(대인연경)의 9지 연기 그대로 |
| 생·노사·재생이 모두 식↔명색 쌍 위에서 일어남 | DN 15 "이만큼으로 태어나고 늙고 죽고 다시 난다 — 명색이 식과 함께 서로 조건 지어 굴러가는 만큼" |
| 둘이 함께 서고, 함께 쓰러짐 | SN 12.67(갈대단의 경): 하나를 빼면 다른 하나도 넘어진다 |
| 기댐이 생기는 순간에야 불(접점)이 생김 | SN 12.67. 홀로 선 갈대는 없다. 기대는 순간에만 서 있음이 있다 |
| 유가 들어오면 식이 커지고 명색이 아래로 뿌리내림 | SN 12.39 "의도하고 계획하고 잠재한 것이 식이 머물 대상이 되고, 식이 머물러 자라면 명색이 내려온다(avakkanti)" |
| 취가 불을 먹임 | upādāna의 본뜻이 "연료" |
| 불의 크기(식의 증장)와 밝기(목숨)를 나눔 — 먹여도 사그라든다 | SN 12.64(식의 증장)와 SN 12.2(늙음: 수명의 감소, 감관의 익음)를 한 그림에 |
| 불의 밝기가 목숨이고, 죽으면 꺼짐 | MN 43 "수명은 열기에 기대고 열기는 수명에 기댄다 — 등불의 불꽃과 빛처럼", SN 22.95 "수명·열기·식이 몸을 떠나면 버려져 눕는다" |
| 늙으면 촉(감관의 문)만 흐려지고, 수·애·취·유는 끝까지 밝음 | SN 12.2 늙음의 정의는 "감관의 익음". 연기 공식은 노사와 함께 "괴로움·근심"(괴로운 느낌, MN 141)이 **생겨난다**고 함. MN 82 여든의 꼬라위야 왕: 몸은 쇠했어도 "세상은 채워지지 않고 갈애의 노예" |
| 불이 새 생으로 옮겨가지 않고 새로 나타남 | MN 38: "바로 이 식이 다른 것 아닌 채 윤회한다"는 사띠의 견해를 물리치고, 불은 타는 연료에 따라 장작불·풀불로 불린다고 함 |
| 마지막 유가 어둠 속에 남았다가, 새 쌍이 맞닿는 순간 꺼짐 | SN 44.9 "몸을 내려놓고 아직 다른 몸을 얻지 않았을 때, 그때는 갈애가 연료다". 유를 옮기지 않는 것도 같은 이유 |
| 새 생이 옛 뿌리 더미에 뿌리박음 | AN 3.76 "업은 밭, 식은 씨앗, 갈애는 물기" |
| 첫 생도 이미 있던 회색 뿌리 사이에서 돋음 | SN 15.1 "윤회는 시작을 알 수 없다(anamatagga). 첫 지점이 드러나지 않는다" |
| 옛 뿌리가 시간이 갈수록 0.1, 0.01로 흐려짐 | 지나간 업의 자취는 남되, 사건 자체는 사라진다(상좌부·경량부의 상속관) |
| 캡션 "~을 조건으로 ~이 있다" | 정형구 그대로. 명색→촉은 DN 15의 순서 |

## 한 줄기 — 무명의 시선

기댐에서 한 가닥 줄기가 뻗어 나가고 불이 그 끝을 따라간다. 이 한 줄기는 **사람이 자기를 보는 방식**이다.
"하나가 이어지며 겪는다"고 여기는 유신견. 그 아래의 Λ는 그 하나가 실은 둘의 기댐에서 형성된 것임을 보여준다.
켜진 사슬이 매번 새 마디에서 Λ를 지나 줄기 끝의 불까지 한 길로 이어지므로, 줄기가 두 갈래에 기대고 있음이 계속 드러난다.

> "왜 '중생'이라 여기는가? 마라여, 그것은 네 견해다. 이것은 순전한 형성들의 더미일 뿐, 여기서 중생은 찾을 수 없다.
> 부품들이 모일 때 '수레'라는 말이 있듯, 무더기들이 있을 때 '중생'이라는 관습이 있다." — SN 5.10 (와지라 비구니)

한 줄기가 "수레"라는 이름이고, 아래 두 갈래가 부품이다.

## 학파에 따라 갈리는 곳

- **죽음과 재생 사이의 정적(3.4초).** 상좌부 아비담마는 죽음 마음 직후 재생 마음이 온다고 보아 중간 존재를 두지 않는다(Kathāvatthu 8.2).
  설일체유부·대승은 중유(中有)를 둔다. 이 앱의 정적은 SN 44.9의 "아직 다른 몸을 얻지 않았을 때"에 근거하며, 그 사이 남는 것은 존재가 아니라 연료(유)다.
- **회색 흔적.** 형태가 남는 흔적은 삼세실유(설일체유부)에 가깝게 읽힐 수 있다. 여기서는 사건이 아니라 **업의 자취**로 읽는다.
  그래서 흔적은 남되 반드시 흐려진다.

## 남은 긴장 — 환멸문이 없다

지금 그림은 유전문(流轉門)만 있다. 애·취·유가 끝까지 밝고, 유가 죽음 너머까지 남고, 모든 수가 빠짐없이 애로 가고, 환멸이 없다.
이것을 합쳐 읽으면 "**무엇도** 갈애를 끝내지 못한다"가 되는데, 이는 멸성제(SN 56.11: 바로 그 갈애의 남김없는 사라짐)와 어긋난다.
늙음이 갈애를 끝내지 못한다(MN 82)는 맞지만, 아무것도 끝내지 못한다는 것은 틀리다.

환멸문의 실마리는 이 그림 안에 이미 있다. MN 72: 불은 연료가 다하면 꺼질 뿐, 어디로 가지 않는다.
지금 죽음은 불을 끄지만 **연료(유)가 남아 있어 다시 붙는다.** 열반은 연료가 다해 꺼지고 다시 붙지 않는 불이다.
구현하려면 (1) 수에서 애로 가지 않는 잔가지가 생겨야 하고, (2) 그런 생은 뿌리를 남기지 않아 다음 쌍이 돋지 않아야 한다.

## 이미 고친 것 (기록)

| 문제 | 고침 |
|---|---|
| 재생 때 불이 옛 자리에서 새 뿌리로 미끄러져 갔다 — "같은 것이 옮겨간다"(MN 38 사띠의 견해) | 불은 제자리에서 새로 생긴다 |

  placeMeet();
  const lv=Math.min(level,14);
  // the core is a node like any other; only the halos grow with what craving piles up
  meet.querySelector('.halo').setAttribute('r',15+lv*1.4);
  meet.querySelector('.halo2').setAttribute('r',30+lv*2.6);
  const k=Math.min(1,level/14);
  const bs=(3.2-k*2.3).toFixed(2)+'s'; meet.style.setProperty('--breath',bs); pair.style.setProperty('--breath',bs);
  meet.style.setProperty('--depth',(1.3-k*0.2).toFixed(3));
}
// the pair grows one step down: 식 root, then 명색 root
function growPair(done){
  const even = level<1;
  const a=growRoot('L',even);
  a.forEach(sg=>drawSeg(roots.L,sg)); a.forEach(sg=>showName(roots.L,sg)); line.textContent='명색을 조건으로 식이 있다';
  later(()=>{
    a.forEach(sg=>mark(sg.ng,'was'));
    const b=growRoot('R',even); b.forEach(sg=>drawSeg(roots.R,sg)); b.forEach(sg=>showName(roots.R,sg)); line.textContent='식을 조건으로 명색이 있다';
    later(()=>{ b.forEach(sg=>mark(sg.ng,'was')); setLevel(level+1); growUp(done); },STEP);
  },STEP);
}
function buildReeds(o){
  resetRoots(o);
  // the first segment of each, already there: the leaning
  const a=growRoot('L',true), b=growRoot('R',true);
  a.forEach(sg=>roots.L.segs.push(sg)); b.forEach(sg=>roots.R.segs.push(sg));
  // each rises from its own foot toward the other; the leaning — and the fire — exist only once they meet
  [...a,...b].forEach(sg=>{
    litPathsG.appendChild(sg.p); sg.p.classList.add('fresh');
    sg.p.setAttribute('d',`M${sg.tip.x.toFixed(1)} ${sg.tip.y.toFixed(1)} L${o.x.toFixed(1)} ${o.y.toFixed(1)}`);   // drawn foot → meeting point
    const Ln=sg.p.getTotalLength();
    sg.p.style.transition='none'; sg.p.style.strokeDasharray=Ln; sg.p.style.strokeDashoffset=Ln;
    mark(sg.ng,'was'); sg.ng.classList.add('onfire'); litNodesG.appendChild(sg.ng);
    sg.p.getBoundingClientRect();
    sg.p.style.transition='stroke-dashoffset '+RISE_MS+'ms cubic-bezier(.3,0,.2,1)'; sg.p.style.strokeDashoffset=0;
  });
  syncPulse([...a,...b].flatMap(sg=>[sg.p,sg.ng.querySelector('circle')]));
  later(()=>[...a,...b].forEach(sg=>{ sg.p.style.transition=''; }),RISE_MS+50);
}
const RISE_MS=1600;
// the meeting: the fire kindles at the point of contact, and the sentence of mutual dependence is said
function kindle(){
  meet.querySelector('.core').setAttribute('r',3.6);          // the point of contact comes into being
  newLife();
  line.textContent='식을 조건으로 명색, 명색을 조건으로 식';
}
// saṃsāra has no discoverable beginning (SN 15.1): even the first life we see takes root among
// the grey roots of lives before it
function seedPast(){
  // lives before this one fill the whole ground, beyond what the view frames; each strand its own grey
  const lines=document.createDocumentFragment(), dots=document.createDocumentFragment(), tips=[], bg=[0x0c,0x0d,0x0f], base=[0x6a,0x6b,0x70];
  const grey=k=>`rgb(${base.map((c,i)=>Math.round(bg[i]+(c-bg[i])*k)).join(',')})`;
  for(let k=0;k<46;k++) tips.push({x:R_(-500,1300),y:R_(-420,900),a:Math.PI/2+R_(-1.6,1.6),k:R_(0.1,0.35)});
  for(let step=0;step<16;step++){
    const next=[];
    tips.forEach(t=>{
      const n=Math.random()<0.45?2:1;
      for(let j=0;j<n;j++){
        // wander hard, even sideways and back across, so the old roots cross and tangle
        const a=Math.PI/2+Math.max(-1.7,Math.min(1.7,(t.a-Math.PI/2)+R_(-1.1,1.1)));
        // built straight into a fragment: no measuring, no layout, so thousands of them load at once
        const len=R_(10,17), x2=t.x+Math.cos(a)*len, y2=t.y+Math.sin(a)*len, c=grey(t.k);
        const p=el('path',{d:`M${t.x.toFixed(1)} ${t.y.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}`,style:`stroke:${c}`,'data-k':t.k});
        const ng=el('g',{class:'node old','data-k':t.k}); ng.appendChild(el('circle',{cx:x2,cy:y2,r:2.6,style:`fill:${c}`}));
        lines.appendChild(p); dots.appendChild(ng);
        const tip={x:x2,y:y2,a,kids:0,k:t.k}; MASS.push(tip); next.push(tip);
      }
    });
    tips.splice(0,tips.length,...next.sort(()=>Math.random()-.5).slice(0,110));
  }
  pastG.appendChild(lines); pastG.appendChild(dots);
  // only the old roots near the first pair stay as ground for later births; the rest is backdrop
  const near=MASS.filter(t=>Math.hypot(t.x-400,t.y-TOP)<110);
  MASS=near.slice();
  near.sort((p,q)=>Math.hypot(p.x-400,p.y-TOP)-Math.hypot(q.x-400,q.y-TOP));
  const o=near[0]||{x:400,y:TOP}; o.kids=(o.kids||0)+1;
  return {x:o.x,y:o.y};
}
{ const o=seedPast(); MEET.x=o.x; MEET.y=o.y; buildReeds(o); }
setLevel(0); appearMeet(); later(kindle,RISE_MS);

// ---- twigs off the leaning ----
function grow(p){
  // hide the whole twig instantly (no transition), then let later growth animate
  const Ln=p.getTotalLength();
  p.style.transition='none';
  p.style.strokeDasharray=Ln; p.style.strokeDashoffset=Ln;
  p.getBoundingClientRect();
  p.style.transition='';
  return Ln;
}
function clearance(x,y,a,len){
  let m=1e9;
  for(let t=0.3;t<=1.001;t+=0.35){
    const px=x+Math.cos(a)*len*t, py=y+Math.sin(a)*len*t;
    if(px<40||px>760||py<20) return 0;
    for(const q of ALL){ const d=Math.hypot(px-q.x,py-q.y); if(d<m) m=d; }
  }
  return m;
}
function sprout(){
  // 촉 arises at the being: every twig starts at the meeting point
  const len=R_(95,125);
  let best=null;
  for(let k=0;k<18;k++){
    const a=-Math.PI/2+R_(-1.5,1.5);
    const c=clearance(MEET.x,MEET.y,a,len);
    if(!best||c>best.c) best={a,c};
  }
  if(!best) return null;
  const g=el('g',{class:'tg'}); twigsG.appendChild(g);
  const x2=MEET.x+Math.cos(best.a)*len, y2=MEET.y+Math.sin(best.a)*len;
  const b=best.a+R_(-.4,.4), cx=MEET.x+Math.cos(b)*len*.5, cy=MEET.y+Math.sin(b)*len*.5;
  const p=el('path',{class:'twig',d:`M${MEET.x} ${MEET.y} Q${cx} ${cy} ${x2} ${y2}`}); g.appendChild(p);
  const Ln=grow(p);
  const nodes=LOOP.map((n,i)=>{
    const t=p.getPointAtLength(Ln*(i+1)/LOOP.length);
    const ng=el('g',{class:'node hid'+(i>=1?' tanha':'')});   // 수·애·취·유: feeling and craving do not age
    ng.appendChild(el('circle',{cx:t.x,cy:t.y,r:3.6}));
    const tx=el('text',{x:t.x,y:t.y-8}); tx.textContent=n; ng.appendChild(tx); g.appendChild(ng);
    ALL.push({x:t.x,y:t.y});
    return {ng,name:n,x:t.x,y:t.y};
  });
  return {g,p,nodes,Ln};
}
function burn(tw,i,prev){
  if(fallen) return;
  const n=tw.nodes[i];
  if(i===0) tw.p.classList.add('was');
  // the twig grows out to this node, then the node appears
  tw.p.style.strokeDashoffset=tw.Ln*(1-(i+1)/tw.nodes.length);
  mark(n.ng,'lit'); line.textContent=says(prev,n.name);
  if(n.name==='유'){
    // 유 and the leaning answer each other: both flare, a thread runs between them for a moment
    n.ng.classList.add('yu'); lastTwig=tw;
    flarePulse();                                        // 유가 들어와 기댐이 한 번 번쩍임
    // the 유 sentence holds one beat, then the pair grows
    later(()=>growPair(afterGrowth), STEP);
  }
  later(()=>{
    mark(n.ng,'was');
    if(i<tw.nodes.length-1){ burn(tw,i+1,n.name); return; }
    feed(tw);
  },STEP);
}
// at 유 the twig ceases; the leaning has grown by what was craved
const MAXSPENT=40;
function feed(tw){
  tw.g.classList.add('spent'); spentG.appendChild(tw.g);   // the event is over; it sinks beneath everything as a grey trace
  const spent=[...spentG.querySelectorAll('.tg.spent')];
  if(spent.length>MAXSPENT){ spent.shift().remove(); ALL=[]; document.querySelectorAll('.tg .node circle').forEach(c=>ALL.push({x:+c.getAttribute('cx'),y:+c.getAttribute('cy')})); }
  // the older the trace, the fainter
  const n=spent.length;
  // newest 0.75, then fading to 0.1 within three steps, and staying there
  spent.forEach((g,i)=>{ const age=Math.min(1,(n-1-i)/3); g.style.opacity=(0.75-age*0.65).toFixed(2); });
}
function flarePulse(){
  const peak=1.3, dur=900, ease='cubic-bezier(.1,.9,.3,1)';
  const scale=[{transform:'scale(1)'},{transform:`scale(${peak})`,offset:.18},{transform:'scale(1)'}];
  meet.querySelectorAll('.core,.halo,.halo2').forEach(c=>c.animate(scale,{duration:dur,easing:ease,composite:'add'}));
  meet.querySelector('.halo').animate([{opacity:0},{opacity:.28,offset:.18},{opacity:0}],{duration:dur,easing:ease,composite:'add'});
  meet.querySelector('.halo2').animate([{opacity:0},{opacity:.12,offset:.18},{opacity:0}],{duration:dur,easing:ease,composite:'add'});
}
// the ground of earlier lives recedes as time goes on: first down to 0.1, then, after a death, to 0.01
let pastFloor=0.1;
function fadePast(){
  const bg=[0x0c,0x0d,0x0f], base=[0x6a,0x6b,0x70];
  pastG.querySelectorAll('[data-k]').forEach(e=>{
    const k=Math.max(pastFloor,(+e.dataset.k)*0.9); e.dataset.k=k;
    const c=`rgb(${base.map((v,i)=>Math.round(bg[i]+(v-bg[i])*k)).join(',')})`;
    if(e.tagName==='path') e.style.stroke=c; else e.querySelector('circle').style.fill=c;
  });
}
function setLife(v){ meet.style.setProperty('--life',v); pair.style.setProperty('--life',v); }
function newLife(){
  LIFE=Math.round(R_(10,24)); age=0; setLife(1);
}
function afterGrowth(){
  age++; fadePast();
  // fed or not, the fire ages: brightness is life left, size is what craving has piled up
  setLife(Math.max(0.12,1-age/LIFE).toFixed(3));
  if(age>=LIFE){ die(); return; }
  later(cycle, 900-Math.round(Math.min(1,level/14)*650));
}
// 노사: the fire goes out; one reed cannot stand without the other, so both are left as grey traces
function die(){
  line.textContent=says('생','노사'); pastFloor=0.01;
  setLife(0); meet.querySelector('.core').setAttribute('r',0);   // the point of contact goes with the leaning
  ageRoot(roots.L); ageRoot(roots.R);
  upG.querySelectorAll('path').forEach(p=>p.classList.add('dead'));
  // the 유 that led here stays lit through the dark, above everything, until the next life begins
  if(lastTwig){ lingerYu=lastTwig.nodes[LOOP.length-1].ng; twigsG.appendChild(lingerYu); lingerYu.classList.add('linger'); }
  later(()=>{ line.textContent='노사'; },1600);
  later(birth,3400);
}
// 생: a new pair takes root in the mass the earlier lives left behind
function birth(){
  const room=MASS.filter(t=>t.kids<2);
  const pool=room.length?room:MASS;
  // prefer the deeper part of the mass, so lives stack downward
  pool.sort((a,b)=>b.y-a.y);
  const o=pool.length?pool[Math.floor(Math.random()*Math.min(pool.length,Math.max(3,pool.length>>1)))]:{x:MEET.x,y:MEET.y};
  o.kids=(o.kids||0)+1;
  line.textContent=says('유','생');
  // as the new pair takes root, that 유 is spent: it goes out in the same instant
  if(lingerYu){ lingerYu.classList.remove('linger'); lastTwig.g.appendChild(lingerYu); lingerYu=null; }
  MEET.x=o.x; MEET.y=o.y; upA=-Math.PI/2;
  buildReeds({x:o.x,y:o.y}); setLevel(0); appearMeet(); later(kindle,RISE_MS);
  later(cycle,RISE_MS+2000);
}
function cycle(){
  if(fallen) return;
  const tw=sprout();
  if(!tw){ later(cycle,1200); return; }
  later(()=>burn(tw,0,'명색'),300);
}

// ---- view: the tree keeps itself centred; the viewer may zoom and drag ----
const svg=$('svg');
const VW=800, VH=620, PAD=46;
let zoom=1, panX=0, panY=0, view=null;
// measure only what holds still: the breathing halo would make the box pulse every frame
const boxGroups=['twigs','spentTwigs','L','R','litPaths','reedNodes','litNodes','up'].map($);
function contentBox(){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const g of boxGroups){
    if(!g.firstChild) continue;
    const b=g.getBBox(); if(!b.width&&!b.height) continue;
    x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.width); y1=Math.max(y1,b.y+b.height);
  }
  const rr=+meet.querySelector('.halo2').getAttribute('r')||30;   // the fire's resting size, not its breath
  x0=Math.min(x0,MEET.x-rr); x1=Math.max(x1,MEET.x+rr);
  y0=Math.min(y0,MEET.y-rr); y1=Math.max(y1,MEET.y+rr);
  if(!isFinite(x0)) return {x:MEET.x-40,y:MEET.y-40,w:80,h:80};
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
function targetView(){
  const b=contentBox(), ar=VW/VH;
  let w=b.w+PAD*2, h=b.h+PAD*2;
  if(w/h<ar) w=h*ar; else h=w/ar;          // fit the whole thing, keeping the stage's shape
  w/=zoom; h/=zoom;
  return {x:b.x+b.w/2-w/2+panX, y:b.y+b.h/2-h/2+panY, w, h};
}
function applyView(v){ svg.setAttribute('viewBox',`${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}`); }
// the view drifts toward its goal on a time constant, and the goal only moves when it
// meaningfully changes — so a twig appearing here or there does not nudge the whole frame
const EASE=900;           // ms to settle
let goal=null, prevT=0;
function tickView(now){
  const dt=prevT?Math.min(80,now-prevT):16.7; prevT=now;
  const want=targetView();
  if(!goal) goal={...want};
  else{
    const tol=Math.max(8,goal.w*0.04);
    if(Math.abs(want.x-goal.x)>tol||Math.abs(want.y-goal.y)>tol||Math.abs(want.w-goal.w)>tol) goal=want;
  }
  if(!view) view={...goal};
  else{ const k=1-Math.exp(-dt/EASE); for(const q of ['x','y','w','h']) view[q]+=(goal[q]-view[q])*k; }
  applyView(view);
  requestAnimationFrame(tickView);
}
requestAnimationFrame(tickView);
const setZoom=z=>{ zoom=Math.min(6,Math.max(0.4,z)); goal=targetView(); };
$('zIn').onclick=()=>setZoom(zoom*1.3);
$('zPause').onclick=()=>setPaused(!paused);
// Space toggles too; a focused button already turns Space into its own click, so leave that to it
addEventListener('keydown',e=>{ if(e.code!=='Space'||e.target.closest('button')) return; e.preventDefault(); setPaused(!paused); });
$('zOut').onclick=()=>setZoom(zoom/1.3);
$('zFit').onclick=()=>{ zoom=1; panX=panY=0; goal=targetView(); };
svg.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(zoom*Math.pow(1.0015,-e.deltaY)); },{passive:false});
// drag to move, pinch to zoom
const pts=new Map(); let last=null, pinch=0;
svg.addEventListener('pointerdown',e=>{ e.preventDefault(); pts.set(e.pointerId,e); svg.setPointerCapture(e.pointerId); svg.classList.add('drag'); last={x:e.clientX,y:e.clientY}; });
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,e);
  const k=view?view.w/svg.clientWidth:1;
  if(pts.size>=2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pinch) setZoom(zoom*(d/pinch));
    pinch=d; last=null;
  }else if(last){
    panX-=(e.clientX-last.x)*k; panY-=(e.clientY-last.y)*k;
    last={x:e.clientX,y:e.clientY}; goal=targetView();
  }
});
const endPt=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=0; if(!pts.size){ last=null; svg.classList.remove('drag'); } };
svg.addEventListener('pointerup',endPt); svg.addEventListener('pointercancel',endPt);

line.textContent='';
later(cycle,RISE_MS+2400);

// ---- the documents: a small markdown reader, enough for headings, tables, quotes, lists, links ----
function md(src){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\[(.+?)\]\((.+?)\)/g,(m,a,b)=>/^[a-z]+\.md$/i.test(b)?`<a href="#" data-doc="${b.replace(/\.md$/i,'').toLowerCase()}">${a}</a>`:`<a href="${b}" target="_blank" rel="noopener">${a}</a>`);
  const lines=src.split('\n'); let out='', i=0;
  while(i<lines.length){
    const l=lines[i];
    const h=/^(#{1,4})\s+(.*)$/.exec(l);
    if(h){ const n=Math.min(h[1].length,3); out+=`<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if(/^\|/.test(l)){ const rows=[]; while(i<lines.length&&/^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${c}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table>'; continue; }
    if(/^>/.test(l)){ const q=[]; while(i<lines.length&&/^>/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/,'')); out+=`<blockquote>${inline(q.join(' '))}</blockquote>`; continue; }
    if(/^- /.test(l)){ const it=[]; while(i<lines.length&&/^(- |\s{2,}\S)/.test(lines[i])){ if(/^- /.test(lines[i])) it.push(lines[i].slice(2)); else it[it.length-1]+=' '+lines[i].trim(); i++; } out+='<ul>'+it.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>'; continue; }
    if(!l.trim()){ i++; continue; }
    const par=[]; while(i<lines.length&&lines[i].trim()&&!/^(#|\||>|- )/.test(lines[i])) par.push(lines[i++]);
    if(!par.length){ i++; continue; }                     // never stall on a line no branch claims
    out+=`<p>${inline(par.join(' '))}</p>`;
  }
  return out;
}
const menu=$('menu'), doc=$('doc');
function openDoc(name){ const src=$('md-'+name); if(!src) return; $('docBox').innerHTML=md(src.textContent.trim()); doc.classList.add('open'); doc.scrollTop=0; menu.classList.remove('open'); }
$('mBtn').onclick=e=>{ e.stopPropagation(); menu.classList.toggle('open'); };
document.addEventListener('click',e=>{ const b=e.target.closest('[data-doc]'); if(b){ e.preventDefault(); openDoc(b.dataset.doc); return; } if(!e.target.closest('#menu')) menu.classList.remove('open'); });
$('docClose').onclick=()=>doc.classList.remove('open');
addEventListener('keydown',e=>{ if(e.key==='Escape'){ doc.classList.remove('open'); menu.classList.remove('open'); } });
</script>
